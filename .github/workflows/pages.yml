name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check calculator discovery quality
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build static site
        env:
          PUBLIC_SITE_DOMAIN: https://nscalculators.com
          PUBLIC_BASE_PATH: ""
        run: python build.py

      - name: Check sitemap eligibility and crawl paths
        run: python scripts/check_indexation_contract.py dist

      - name: Check structured data and breadcrumb target consistency
        run: python scripts/check_schema_contract.py dist

      - name: Check analytics URL metadata minimization
        run: node scripts/test_analytics_context.cjs dist/area-calculator/index.html

      - name: Check elapsed-time calculations
        run: node scripts/test_time_duration.cjs dist/assets/calculator.js

      - name: Check calculator bundle versions across all pages
        run: python scripts/check_calculator_assets.py dist

      - name: Check shared stylesheet versions across styled pages
        run: python scripts/check_stylesheet_assets.py dist

      - name: Check 401(k) employer matching
        run: node scripts/test_401k_match.cjs dist/assets/calculator.js

      - name: Check trade-in versus private-sale comparisons
        run: node scripts/test_vehicle_sale_comparison.cjs dist/assets/calculator.js

      - name: Check purchase cash and down payments
        run: node scripts/test_down_payment.cjs dist/assets/calculator.js

      - name: Check rebate versus promotional financing
        run: node scripts/test_cash_back.cjs dist/assets/calculator.js

      - name: Check adult body composition estimates and pie chart units
        run: node scripts/test_body_fat.cjs dist/assets/calculator.js

      - name: Check result chart units, labels and signed values
        run: node scripts/test_result_charts.cjs dist/assets/calculator.js

      - name: Check fuel cost units, budgets and input validation
        run: node scripts/test_fuel_cost.cjs dist/assets/calculator.js

      - name: Check natural-language calculator search and ranking
        run: node scripts/test_site_search.cjs dist/assets/search.js dist/assets/search-index.json

      - name: Check additive and subtractive room area totals
        run: node scripts/test_area_sections.cjs dist/assets/calculator.js

      - name: Check saved area measurements and local CSV downloads
        run: node scripts/test_area_records.cjs dist/assets/calculator.js

      - name: Check area boundaries and stable triangle formulas
        run: node scripts/test_area_geometry.cjs dist/assets/calculator.js

      - name: Check scoped calculator keyboard submission
        run: node scripts/test_calculator_keyboard.cjs dist/assets/calculator.js

      - name: Check comparable-based used-car valuation
        run: node scripts/test_used_car_value.cjs dist/assets/calculator.js

      - name: Check new-versus-used ownership and sale cash-flow reconciliation
        run: node scripts/test_new_used.cjs dist/assets/calculator.js

      - name: Check personal-loan net cash, fees and repayment schedules
        run: node scripts/test_personal_loan.cjs dist/assets/calculator.js

      - name: Check PC evidence ranges and target-status wording
        run: node scripts/test_bottleneck.cjs dist/assets/calculator.js

      - name: Check boat purchase cash flow and repayment schedule
        run: node scripts/test_boat_loan.cjs dist/assets/calculator.js

      - name: Check shared fixed-installment payment validation and term handling
        run: node scripts/test_basic_installment.cjs dist/assets/calculator.js

      - name: Check exact-cent tips and bill splitting
        run: node scripts/test_tip.cjs dist/assets/calculator.js

      - name: Check ratios, small outputs and allocation ranges
        run: node scripts/test_ratio.cjs dist/assets/calculator.js

      - name: Check shared numeric formatting and formatter reuse
        run: node scripts/test_number_formatters.cjs dist/assets/calculator.js

      - name: Check proportion and mean sample-size planning
        run: node scripts/test_sample_size.cjs dist/assets/calculator.js

      - name: Check seconds/hours precision and duration decomposition
        run: node scripts/test_seconds_hours.cjs dist/assets/calculator.js

      - name: Check calendar days and weekdays across US time zones
        run: |
          TZ=America/Los_Angeles node scripts/test_calendar_days.cjs dist/assets/calculator.js
          TZ=America/New_York node scripts/test_calendar_days.cjs dist/assets/calculator.js
          TZ=UTC node scripts/test_calendar_days.cjs dist/assets/calculator.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
