name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check calculator discovery quality
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build static site
        env:
          PUBLIC_SITE_DOMAIN: https://nscalculators.com
          PUBLIC_BASE_PATH: ""
        run: python build.py

      - name: Check elapsed-time calculations
        run: node scripts/test_time_duration.cjs dist/assets/calculator.js

      - name: Check calculator bundle versions across all pages
        run: python scripts/check_calculator_assets.py dist

      - name: Check 401(k) employer matching
        run: node scripts/test_401k_match.cjs dist/assets/calculator.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
